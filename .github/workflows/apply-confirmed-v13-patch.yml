name: Apply confirmed v0.13 video UX patch

on:
  push:
    branches: [ xhs-online-regression ]
    paths:
      - '.github/workflows/apply-confirmed-v13-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: xhs-online-regression

      - name: Apply confirmed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          downloader = 'app/src/main/java/com/combustible12/hdresourceextractor/XhsVideoDownloader.kt'
          old_download = '''    fun download(
              candidates: List<String>,
              userAgent: String,
              referer: String,
              cookies: Map<String, String>,
              callback: (Result) -> Unit
          ) {
              Thread {
                  if (candidates.isEmpty()) {
                      callback(Result(false, "没有可用的视频源"))
                      return@Thread
                  }

                  var lastReason = "视频源不可用"
                  candidates.forEachIndexed { index, url ->
                      try {
                          val fetched = fetchCandidate(
                              url = url,
                              userAgent = userAgent,
                              referer = referer,
                              cookie = cookies[url].orEmpty(),
                              candidateIndex = index
                          )
                          if (fetched != null) {
                              val saved = saveToMediaStore(fetched)
                              if (saved) {
                                  callback(Result(true, "视频已保存到 Movies/HDResourceExtractor", url))
                                  return@Thread
                              }
                              lastReason = "视频已获取，但写入手机存储失败"
                          }
                      } catch (e: Exception) {
                          lastReason = e.message ?: "视频源请求失败"
                      }
                  }

                  callback(Result(false, "视频下载失败：已自动尝试 ${candidates.size} 个源；$lastReason"))
              }.start()
          }
'''
          new_download = '''    fun download(
              candidates: List<String>,
              userAgent: String,
              referer: String,
              cookies: Map<String, String>,
              status: ((String) -> Unit)? = null,
              callback: (Result) -> Unit
          ) {
              Thread {
                  if (candidates.isEmpty()) {
                      callback(Result(false, "没有可用的视频源"))
                      return@Thread
                  }

                  val maxAttemptsPerSource = 3
                  var lastReason = "视频源不可用"

                  candidates.forEachIndexed { index, url ->
                      for (attempt in 1..maxAttemptsPerSource) {
                          status?.invoke(
                              if (attempt == 1) "正在下载视频…"
                              else "正在自动重试 $attempt/$maxAttemptsPerSource…"
                          )

                          try {
                              val fetched = fetchCandidate(
                                  url = url,
                                  userAgent = userAgent,
                                  referer = referer,
                                  cookie = cookies[url].orEmpty(),
                                  candidateIndex = index
                              )
                              if (fetched != null) {
                                  val saved = saveToMediaStore(fetched)
                                  if (saved) {
                                      callback(Result(true, "视频已保存到 Movies/HDResourceExtractor", url))
                                      return@Thread
                                  }
                                  lastReason = "视频已获取，但写入手机存储失败"
                              } else {
                                  lastReason = "视频源返回的内容无效"
                              }
                          } catch (e: Exception) {
                              lastReason = friendlyReason(e.message ?: "视频源请求失败")
                          }

                          if (attempt < maxAttemptsPerSource) {
                              status?.invoke(
                                  "$lastReason，正在自动重试 ${attempt + 1}/$maxAttemptsPerSource…"
                              )
                              try {
                                  Thread.sleep(1_000)
                              } catch (_: InterruptedException) {
                                  Thread.currentThread().interrupt()
                                  callback(Result(false, "视频下载已中断"))
                                  return@Thread
                              }
                          }
                      }
                  }

                  callback(
                      Result(
                          false,
                          "视频下载失败：已自动重试 $maxAttemptsPerSource 次；$lastReason"
                      )
                  )
              }.start()
          }

          private fun friendlyReason(raw: String): String {
              val lower = raw.lowercase()
              return when {
                  lower.contains("connection closed") ||
                      lower.contains("connection reset") ||
                      lower.contains("unexpected end") ||
                      lower.contains("broken pipe") -> "连接中断"
                  lower.contains("timed out") || lower.contains("timeout") -> "连接超时"
                  else -> raw
              }
          }
'''
          replace_once(downloader, old_download, new_download, 'video downloader retry block')

          old_finally = '''            } finally {
                  connection?.disconnect()
              }
'''
          new_finally = '''            } catch (e: Exception) {
                  tempFile?.delete()
                  throw e
              } finally {
                  connection?.disconnect()
              }
'''
          replace_once(downloader, old_finally, new_finally, 'temporary video cleanup')

          activity = 'app/src/main/java/com/combustible12/hdresourceextractor/MainActivityV13.kt'
          old_cards = '''    private fun videoCard(): LinearLayout = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              background = rounded(Color.WHITE, 10)
              val preview = ImageView(this@MainActivityV13).apply {
                  scaleType = ImageView.ScaleType.CENTER_CROP
                  setBackgroundColor(Color.rgb(28, 28, 28))
                  if (coverUrl.isNotBlank()) load(coverUrl) { crossfade(true) }
              }
              addView(preview, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(220)))
              addView(resourceButton("下载无水印视频") { downloadOriginalVideo() })
              addView(resourceButton("复制视频链接") { copyText(originVideoUrl, "视频链接已复制") })
          }

          private fun imageCard(url: String, index: Int, isCover: Boolean): LinearLayout =
              LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = rounded(Color.WHITE, 10)
                  addView(
                      ImageView(this@MainActivityV13).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(235, 237, 240))
                          load(url) { crossfade(true) }
                      },
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(if (isCover) 220 else 190)
                      )
                  )
                  addView(resourceButton(if (isCover) "下载封面图" else "下载图片") {
                      if (enqueueImage(url, index, isCover)) {
                          Toast.makeText(this@MainActivityV13, "已加入下载队列", Toast.LENGTH_SHORT).show()
                      }
                  })
                  addView(resourceButton(if (isCover) "复制封面链接" else "复制图片链接") {
                      copyText(url, "链接已复制")
                  })
              }

          private fun resourceButton(label: String, action: () -> Unit): Button = Button(this).apply {
              text = label
              isAllCaps = false
              textSize = 13f
              gravity = Gravity.START or Gravity.CENTER_VERTICAL
              minHeight = 0
              minimumHeight = 0
              minWidth = 0
              minimumWidth = 0
              setTextColor(Color.rgb(55, 55, 55))
              setPadding(dp(12), 0, dp(12), 0)
              background = rounded(Color.WHITE, 0, Color.rgb(235, 237, 240))
              setOnClickListener { action() }
          }
'''
          new_cards = '''    private fun videoCard(): LinearLayout = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              background = rounded(Color.WHITE, 10)
              val preview = ImageView(this@MainActivityV13).apply {
                  scaleType = ImageView.ScaleType.CENTER_CROP
                  setBackgroundColor(Color.rgb(28, 28, 28))
                  if (coverUrl.isNotBlank()) load(coverUrl) { crossfade(true) }
              }
              addView(preview, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(220)))

              val actions = LinearLayout(this@MainActivityV13).apply {
                  orientation = LinearLayout.HORIZONTAL
              }
              actions.addView(
                  resourceButton("下载视频", true) { downloadOriginalVideo() },
                  LinearLayout.LayoutParams(0, dp(54), 1f).apply { rightMargin = dp(5) }
              )
              actions.addView(
                  resourceButton("复制链接", false) { copyText(originVideoUrl, "视频链接已复制") },
                  LinearLayout.LayoutParams(0, dp(54), 1f).apply { leftMargin = dp(5) }
              )
              addView(
                  actions,
                  LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(54)).apply {
                      leftMargin = dp(8)
                      rightMargin = dp(8)
                      topMargin = dp(8)
                      bottomMargin = dp(8)
                  }
              )
          }

          private fun imageCard(url: String, index: Int, isCover: Boolean): LinearLayout =
              LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = rounded(Color.WHITE, 10)
                  addView(
                      ImageView(this@MainActivityV13).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.rgb(235, 237, 240))
                          load(url) { crossfade(true) }
                      },
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(if (isCover) 220 else 190)
                      )
                  )

                  if (isCover) {
                      val actions = LinearLayout(this@MainActivityV13).apply {
                          orientation = LinearLayout.HORIZONTAL
                      }
                      actions.addView(
                          resourceButton("保存封面", true) {
                              if (enqueueImage(url, index, true)) {
                                  Toast.makeText(this@MainActivityV13, "封面已加入下载队列", Toast.LENGTH_SHORT).show()
                              }
                          },
                          LinearLayout.LayoutParams(0, dp(54), 1f).apply { rightMargin = dp(5) }
                      )
                      actions.addView(
                          resourceButton("复制链接", false) { copyText(url, "封面链接已复制") },
                          LinearLayout.LayoutParams(0, dp(54), 1f).apply { leftMargin = dp(5) }
                      )
                      addView(
                          actions,
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(54)).apply {
                              leftMargin = dp(8)
                              rightMargin = dp(8)
                              topMargin = dp(8)
                              bottomMargin = dp(8)
                          }
                      )
                  } else {
                      addView(
                          resourceButton("下载图片", true) {
                              if (enqueueImage(url, index, false)) {
                                  Toast.makeText(this@MainActivityV13, "已加入下载队列", Toast.LENGTH_SHORT).show()
                              }
                          },
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48)).apply {
                              leftMargin = dp(6)
                              rightMargin = dp(6)
                              topMargin = dp(6)
                          }
                      )
                      addView(
                          resourceButton("复制图片链接", false) { copyText(url, "链接已复制") },
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48)).apply {
                              leftMargin = dp(6)
                              rightMargin = dp(6)
                              topMargin = dp(5)
                              bottomMargin = dp(6)
                          }
                      )
                  }
              }

          private fun resourceButton(label: String, primary: Boolean, action: () -> Unit): Button =
              Button(this).apply {
                  text = label
                  isAllCaps = false
                  textSize = 14f
                  gravity = Gravity.CENTER
                  minHeight = dp(48)
                  minimumHeight = dp(48)
                  minWidth = 0
                  minimumWidth = 0
                  setTextColor(if (primary) Color.WHITE else Color.rgb(55, 55, 55))
                  setPadding(dp(12), 0, dp(12), 0)
                  background = if (primary) {
                      rounded(Color.rgb(41, 156, 235), 8)
                  } else {
                      rounded(Color.rgb(247, 248, 250), 8, Color.rgb(210, 214, 220))
                  }
                  setOnClickListener { action() }
              }
'''
          replace_once(activity, old_cards, new_cards, 'large side-by-side resource buttons')

          old_call = '''        statusText.text = "正在下载并验证无水印原视频…"
              XhsVideoDownloader(this).download(
                  candidates = listOf(url),
                  userAgent = webView.settings.userAgentString.orEmpty(),
                  referer = currentPageUrl,
                  cookies = cookies
              ) { result ->
'''
          new_call = '''        statusText.text = "正在下载视频…"
              XhsVideoDownloader(this).download(
                  candidates = listOf(url),
                  userAgent = webView.settings.userAgentString.orEmpty(),
                  referer = currentPageUrl,
                  cookies = cookies,
                  status = { message ->
                      runOnUiThread { statusText.text = message }
                  }
              ) { result ->
'''
          replace_once(activity, old_call, new_call, 'download progress status')

          workflow = '.github/workflows/xhs-android-emulator.yml'
          old_video_step = '''      - name: Test video note in real Android WebView
              run: |
                set -euxo pipefail
                PKG='com.combustible12.hdresourceextractor'
                ACT='com.combustible12.hdresourceextractor/.MainActivityV13'
                URL='https://xhslink.cn/o/91iT26p7qax'
                adb logcat -c || true
                adb shell am force-stop "$PKG"
                adb shell am start -W -n "$ACT" -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "$URL"

                for attempt in $(seq 1 10); do
                  sleep 3
                  adb shell uiautomator dump /sdcard/video-note.xml >/dev/null 2>&1 || true
                  adb pull /sdcard/video-note.xml android-report/video-note.xml >/dev/null 2>&1 || true
                  if grep -Fq '无水印视频（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '封面图（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '笔记文案' android-report/video-note.xml 2>/dev/null; then
                    echo "Video note ready after $((attempt * 3)) seconds."
                    break
                  fi
                done

                adb exec-out screencap -p > android-report/video-note.png
                adb logcat -d -v time > android-report/video-note-logcat.txt || true
                grep -F '无水印视频（1）' android-report/video-note.xml
                grep -F '封面图（1）' android-report/video-note.xml
                grep -F '笔记文案' android-report/video-note.xml
'''
          new_video_step = '''      - name: Test video note and real MP4 download in Android WebView
              run: |
                set -euxo pipefail
                PKG='com.combustible12.hdresourceextractor'
                ACT='com.combustible12.hdresourceextractor/.MainActivityV13'
                URL='https://xhslink.cn/o/91iT26p7qax'
                adb logcat -c || true
                adb shell am force-stop "$PKG"
                adb shell am start -W -n "$ACT" -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "$URL"

                for attempt in $(seq 1 10); do
                  sleep 3
                  adb shell uiautomator dump /sdcard/video-note.xml >/dev/null 2>&1 || true
                  adb pull /sdcard/video-note.xml android-report/video-note.xml >/dev/null 2>&1 || true
                  if grep -Fq '无水印视频（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '封面图（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '笔记文案' android-report/video-note.xml 2>/dev/null && grep -Fq '下载视频' android-report/video-note.xml 2>/dev/null && grep -Fq '保存封面' android-report/video-note.xml 2>/dev/null; then
                    echo "Video note ready after $((attempt * 3)) seconds."
                    break
                  fi
                done

                adb exec-out screencap -p > android-report/video-note.png
                grep -F '无水印视频（1）' android-report/video-note.xml
                grep -F '封面图（1）' android-report/video-note.xml
                grep -F '笔记文案' android-report/video-note.xml
                grep -F '下载视频' android-report/video-note.xml
                grep -F '保存封面' android-report/video-note.xml

                adb shell rm -rf /sdcard/Movies/HDResourceExtractor || true

                BUTTON_CENTER="$(python3 - <<'PY2'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse('android-report/video-note.xml').getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == '下载视频':
                  match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                  if not match:
                      raise SystemExit('下载视频按钮 bounds 无效')
                  x1, y1, x2, y2 = map(int, match.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          else:
              raise SystemExit('没有找到下载视频按钮')
          PY2
                )"
                read -r TAP_X TAP_Y <<< "$BUTTON_CENTER"
                adb shell input tap "$TAP_X" "$TAP_Y"

                DOWNLOAD_OK=0
                VIDEO_PATH=''
                for attempt in $(seq 1 30); do
                  sleep 3
                  adb shell uiautomator dump /sdcard/video-download.xml >/dev/null 2>&1 || true
                  adb pull /sdcard/video-download.xml android-report/video-download.xml >/dev/null 2>&1 || true
                  VIDEO_PATH="$(adb shell 'find /sdcard/Movies/HDResourceExtractor -type f -name "*.mp4" 2>/dev/null | head -n 1' | tr -d '\r')"
                  if grep -Fq '视频已保存到 Movies/HDResourceExtractor' android-report/video-download.xml 2>/dev/null && [ -n "$VIDEO_PATH" ]; then
                    DOWNLOAD_OK=1
                    echo "Video download finished after $((attempt * 3)) seconds: $VIDEO_PATH"
                    break
                  fi
                done

                adb exec-out screencap -p > android-report/video-download.png
                adb logcat -d -v time > android-report/video-note-logcat.txt || true

                if [ "$DOWNLOAD_OK" -ne 1 ] || [ -z "$VIDEO_PATH" ]; then
                  echo 'Real MP4 download did not finish successfully.'
                  cat android-report/video-download.xml 2>/dev/null || true
                  adb shell ls -la /sdcard/Movies/HDResourceExtractor 2>/dev/null || true
                  exit 1
                fi

                VIDEO_SIZE="$(adb shell "stat -c %s '$VIDEO_PATH'" | tr -d '\r' | tail -n 1)"
                test "$VIDEO_SIZE" -gt 131072
                {
                  echo "downloaded_video=$VIDEO_PATH"
                  echo "bytes=$VIDEO_SIZE"
                } | tee android-report/video-download.txt
'''
          replace_once(workflow, old_video_step, new_video_step, 'real Android video download regression')

          old_summary = '''            if grep -Fq '无水印视频（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '封面图（1）' android-report/video-note.xml 2>/dev/null; then
                    echo '- ✅ 视频笔记：Android WebView 输出 1 个无水印原视频 + 1 张封面'
                  else
                    echo '- ❌ 视频笔记：Android WebView 未输出完整视频/封面结果'
                  fi
'''
          new_summary = '''            if grep -Fq '无水印视频（1）' android-report/video-note.xml 2>/dev/null && grep -Fq '封面图（1）' android-report/video-note.xml 2>/dev/null && grep -Fq 'downloaded_video=' android-report/video-download.txt 2>/dev/null; then
                    echo '- ✅ 视频笔记：识别原视频/封面，并实际下载 MP4 到 Android 媒体目录'
                  else
                    echo '- ❌ 视频笔记：识别或真实 MP4 下载未完整通过'
                  fi
'''
          replace_once(workflow, old_summary, new_summary, 'Android regression summary')
          PY

          rm -f .github/workflows/apply-confirmed-v13-patch.yml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Improve video download retries and mobile actions'
          git push origin HEAD:xhs-online-regression
