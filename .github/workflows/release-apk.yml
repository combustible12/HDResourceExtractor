name: Publish APK Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hdresourceextractor-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify tag matches application version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName '$tag'" app/build.gradle || { echo "Version name does not match tag"; exit 1; }
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HDResourceExtractor-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" "HDResourceExtractor-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --notes "HDResourceExtractor Android update"
