name: Publish signed APK release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'release/signing-cert.sha256'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hdresourceextractor
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HDRESOURCEEXTRACTOR_STORE_PASSWORD: ${{ secrets.HDRESOURCEEXTRACTOR_STORE_PASSWORD }}
      HDRESOURCEEXTRACTOR_KEY_ALIAS: ${{ secrets.HDRESOURCEEXTRACTOR_KEY_ALIAS }}
      HDRESOURCEEXTRACTOR_KEY_PASSWORD: ${{ secrets.HDRESOURCEEXTRACTOR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Prepare permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HDRESOURCEEXTRACTOR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$HDRESOURCEEXTRACTOR_STORE_PASSWORD"
          test -n "$HDRESOURCEEXTRACTOR_KEY_ALIAS"
          test -n "$HDRESOURCEEXTRACTOR_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/hdresourceextractor-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "HDRESOURCEEXTRACTOR_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Run download lifecycle and media regression tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release signer and package
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]' | head -1)
          expected=$(tr -d '[:space:]' < release/signing-cert.sha256 \
            | tr '[:upper:]' '[:lower:]')
          test -n "$actual"
          test "$actual" = "$expected"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.combustible12.hdresourceextractor'"
          "$aapt" dump permissions "$apk" | grep -F "android.permission.ACCESS_NETWORK_STATE"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting it."
            exit 0
          fi
          asset="HDResourceExtractor-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          gh release create "$tag" "$asset" \
            --title "$tag" --target "$GITHUB_SHA" \
            --notes "Permanent release signing baseline. Future one-tap updates are verified against the same signing certificate."
