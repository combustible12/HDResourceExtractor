name: Publish APK Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hdresourceextractor
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hdresourceextractor-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - name: Parser regression tests
        run: node tests/platform-parser-regression.mjs
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting it."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "HDResourceExtractor-$tag.apk"
          gh release create "$tag" "HDResourceExtractor-$tag.apk" \
            --title "$tag" \
            --notes "Image, video, HLS and one-tap upgrade improvements."
