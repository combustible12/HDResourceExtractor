name: XHS Online Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/**'
      - '.github/workflows/xhs-online-regression.yml'
      - 'app/src/main/assets/xhs_parser.js'
      - 'app/src/main/java/com/combustible12/hdresourceextractor/**'
      - 'app/build.gradle'

permissions:
  contents: read

jobs:
  regression:
    name: Cloud regression (7 images + original video)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Ensure ffmpeg is available
        run: |
          command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffprobe -version | head -n 1

      - name: Probe page structure
        run: node tests/xhs-online-probe.mjs

      - name: Validate exact resources and downloads
        run: node tests/xhs-cloud-regression.mjs

      - name: Validate the same parser Android will use
        run: node tests/xhs-shared-parser-regression.mjs

      - name: Publish readable summaries
        if: always()
        run: |
          for report in test-report/summary.md regression-report/summary.md shared-parser-report/summary.md; do
            if [ -f "$report" ]; then
              printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xhs-online-probe-report
          path: test-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload regression media and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xhs-cloud-regression-report
          path: regression-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload shared-parser report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xhs-shared-parser-report
          path: shared-parser-report/
          if-no-files-found: warn
          retention-days: 14
