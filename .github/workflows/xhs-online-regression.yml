name: XHS Online Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/**'
      - '.github/workflows/xhs-online-regression.yml'
      - 'app/src/main/java/com/combustible12/hdresourceextractor/**'
      - 'app/build.gradle'

permissions:
  contents: read

jobs:
  probe:
    name: Online probe (7 images + 1 video)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Probe 7-image and video samples
        run: node tests/xhs-online-probe.mjs

      - name: Publish readable summary
        if: always()
        run: |
          if [ -f test-report/summary.md ]; then
            cat test-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and raw report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xhs-online-probe-report
          path: test-report/
          if-no-files-found: warn
          retention-days: 14
