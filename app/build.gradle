plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.combustible12.hdresourceextractor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.combustible12.hdresourceextractor'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.coil-kt:coil:2.7.0'
}

// Temporary source normalization for the current programmatic UI file.
// Keeps CI builds deterministic while the UI is still being iterated quickly.
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.doFirst {
            def source = file('src/main/java/com/combustible12/hdresourceextractor/MainActivity.kt')
            if (source.exists()) {
                def text = source.getText('UTF-8')
                text = text.replace(
                    '(value * resources.displayMetrics.density).toInt()',
                    '(value * getResources().displayMetrics.density).toInt()'
                )
                text = text.replace(
                    'ScrollView.LayoutParams(',
                    'FrameLayout.LayoutParams('
                )
                source.write(text, 'UTF-8')
            }
        }
    }
}
