plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.combustible12.hdresourceextractor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.combustible12.hdresourceextractor'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.coil-kt:coil:2.7.0'
}

// Temporary source normalization for the current programmatic UI file.
// Keeps CI builds deterministic while the UI is still being iterated quickly.
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.doFirst {
            def source = file('src/main/java/com/combustible12/hdresourceextractor/MainActivity.kt')
            if (source.exists()) {
                def text = source.getText('UTF-8')

                text = text.replace(
                    '(value * resources.displayMetrics.density).toInt()',
                    '(value * getResources().displayMetrics.density).toInt()'
                )
                text = text.replace(
                    'ScrollView.LayoutParams(',
                    'FrameLayout.LayoutParams('
                )

                // Xiaohongshu full/original image conversion.
                if (!text.contains('private fun xhsOriginalImageUrl(')) {
                    def marker = '    private fun isLikelyXhsMainImage('
                    def helper = '''    private fun xhsOriginalImageUrl(url: String): String {
        return try {
            val uri = Uri.parse(url)
            val host = uri.host?.lowercase(Locale.US).orEmpty()

            if (host == "ci.xiaohongshu.com") {
                url.substringBefore('?').substringBefore('#')
            } else if (host.endsWith("xhscdn.com")) {
                val segments = uri.pathSegments
                val timestampIndex = segments.indexOfFirst {
                    it.matches(Regex("[0-9]{12}"))
                }

                if (timestampIndex < 0 || timestampIndex + 2 >= segments.size) {
                    url
                } else {
                    val hash = segments[timestampIndex + 1]
                    if (!hash.matches(Regex("[0-9a-fA-F]{32}"))) {
                        url
                    } else {
                        val payload = segments.drop(timestampIndex + 2).toMutableList()
                        if (payload.isEmpty()) {
                            url
                        } else {
                            val imageId = payload.last()
                                .substringBefore('!')
                                .substringBefore('?')
                            if (imageId.isBlank()) {
                                url
                            } else {
                                payload[payload.lastIndex] = imageId
                                "https://ci.xiaohongshu.com/" + payload.joinToString("/")
                            }
                        }
                    }
                }
            } else {
                url
            }
        } catch (_: Exception) {
            url
        }
    }

'''
                    text = text.replace(marker, helper + marker)
                }

                text = text.replace(
                    'xhsCandidates[key] = url',
                    'xhsCandidates[key] = xhsOriginalImageUrl(url)'
                )
                text = text.replace(
                    '"正文图片（${snapshot.size}）"',
                    '"无水印原图（${snapshot.size}）"'
                )
                text = text.replace(
                    '"已识别 ${filtered.size} 张小红书正文图片"',
                    '"已识别 ${filtered.size} 张小红书无水印原图"'
                )

                // Caption state + UI.
                if (!text.contains('private lateinit var captionText: TextView')) {
                    text = text.replace(
                        '    private lateinit var saveAllButton: Button\n',
                        '''    private lateinit var saveAllButton: Button
    private lateinit var captionCard: LinearLayout
    private lateinit var captionText: TextView
    private lateinit var copyCaptionButton: Button
'''
                    )
                    text = text.replace(
                        '    private var xhsFallbackShown: Boolean = false\n',
                        '''    private var xhsFallbackShown: Boolean = false
    private var xhsCaption: String = ""
'''
                    )
                }

                if (!text.contains('text = "复制文案"')) {
                    def uiMarker = '''        val resultHeader = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
        }
'''
                    def captionUi = '''        captionCard = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(12), dp(10), dp(12), dp(10))
            background = roundedBackground(Color.WHITE, 10)
            visibility = View.GONE
        }

        val captionHeader = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
        }
        val captionLabel = TextView(this).apply {
            text = "笔记文案"
            textSize = 15f
            setTypeface(typeface, Typeface.BOLD)
            setTextColor(Color.rgb(36, 36, 36))
        }
        captionHeader.addView(
            captionLabel,
            LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
        )

        copyCaptionButton = Button(this).apply {
            text = "复制文案"
            isAllCaps = false
            textSize = 13f
            setTextColor(Color.rgb(41, 156, 235))
            minHeight = 0
            minimumHeight = 0
            minWidth = 0
            minimumWidth = 0
            setPadding(dp(12), 0, dp(12), 0)
            background = roundedBackground(Color.rgb(239, 248, 255), 8)
            setOnClickListener {
                if (xhsCaption.isNotBlank()) copyToClipboard(xhsCaption)
            }
        }
        captionHeader.addView(
            copyCaptionButton,
            LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(36))
        )
        captionCard.addView(
            captionHeader,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            )
        )

        captionText = TextView(this).apply {
            textSize = 14f
            setTextColor(Color.rgb(55, 55, 55))
            setLineSpacing(0f, 1.18f)
            maxLines = 5
            ellipsize = android.text.TextUtils.TruncateAt.END
            setPadding(0, dp(8), 0, 0)
        }
        captionCard.addView(
            captionText,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            )
        )
        foreground.addView(
            captionCard,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            ).apply { bottomMargin = dp(10) }
        )

'''
                    text = text.replace(uiMarker, captionUi + uiMarker)
                }

                // Extract title + description from the Xiaohongshu note DOM.
                if (!text.contains('HDExtractor.setCaption')) {
                    def scriptMarker = '''              try { HDExtractor.doneXhs(seen.size); } catch(e) {}
'''
                    def captionScript = '''              try {
                const titleEl = document.querySelector('#detail-title');
                const descEl = document.querySelector('#detail-desc');
                let title = titleEl ? (titleEl.innerText || titleEl.textContent || '') : '';
                let desc = descEl ? (descEl.innerText || descEl.textContent || '') : '';

                if (!title) {
                  const metaTitle = document.querySelector('meta[property="og:title"]');
                  title = metaTitle ? (metaTitle.getAttribute('content') || '') : '';
                }
                if (!desc) {
                  const metaDesc = document.querySelector('meta[name="description"], meta[property="og:description"]');
                  desc = metaDesc ? (metaDesc.getAttribute('content') || '') : '';
                }

                title = String(title || '').trim();
                desc = String(desc || '').trim();
                if (title || desc) HDExtractor.setCaption(title, desc);
              } catch(e) {}

'''
                    text = text.replace(scriptMarker, captionScript + scriptMarker)
                }

                if (!text.contains('fun setCaption(title: String, desc: String)')) {
                    def bridgeMarker = '''        @JavascriptInterface
        fun doneXhs(count: Int) {
'''
                    def bridgeMethod = '''        @JavascriptInterface
        fun setCaption(title: String, desc: String) {
            val cleanTitle = title.trim()
            val cleanDesc = desc.trim()
            val combined = when {
                cleanTitle.isNotBlank() && cleanDesc.isNotBlank() && cleanDesc != cleanTitle ->
                    cleanTitle + "\\n\\n" + cleanDesc
                cleanDesc.isNotBlank() -> cleanDesc
                else -> cleanTitle
            }.trim()

            if (combined.isBlank()) return
            runOnUiThread {
                xhsCaption = combined
                if (::captionCard.isInitialized) {
                    captionText.text = combined
                    captionCard.visibility = View.VISIBLE
                }
            }
        }

'''
                    text = text.replace(bridgeMarker, bridgeMethod + bridgeMarker)
                }

                // Clear previous caption when a new URL is parsed.
                text = text.replace(
                    '''        xhsFallbackShown = false

        synchronized(resources)''',
                    '''        xhsFallbackShown = false
        xhsCaption = ""
        if (::captionCard.isInitialized) {
            captionText.text = ""
            captionCard.visibility = View.GONE
        }

        synchronized(resources)'''
                )

                text = text.replace('HDResourceExtractor/0.5', 'HDResourceExtractor/0.7')
                text = text.replace('HDResourceExtractor/0.6', 'HDResourceExtractor/0.7')

                source.write(text, 'UTF-8')
            }
        }
    }
}
