                text = text.replace('HDResourceExtractor/0.6', 'HDResourceExtractor/0.9')
                text = text.replace('HDResourceExtractor/0.7', 'HDResourceExtractor/0.9')
                text = text.replace('HDResourceExtractor/0.8', 'HDResourceExtractor/0.9')

                source.write(text, 'UTF-8')
            }
        }
    }
}
