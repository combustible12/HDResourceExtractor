        var url = rawUrl
            .replace("&amp;", "&")
            .trim()

        if (url.startsWith("//")) url = "https:$url"
        if (!isLikelyXhsVideo(url)) return

        val key = url.substringBefore('#').substringBefore('?')
        if (key.isBlank()) return

        var score = 0
        val lower = url.lowercase(Locale.US)
        if (url.startsWith("https://")) score += 30
        if (source == "originVideoKey") score += 5000
        if (source == "masterUrl") score += 4000
        if (lower.contains(".mp4")) score += 1600
        if (!lower.contains(".m3u8")) score += 800
        if (lower.contains("sns-video")) score += 500

        synchronized(xhsVideoCandidates) {
            val oldScore = xhsVideoScores[key] ?: Int.MIN_VALUE
            if (score > oldScore) {
                xhsVideoCandidates[key] = url
                xhsVideoScores[key] = score
            }
        }
    }

    private fun isLikelyXhsVideo(url: String): Boolean {
        val lower = url.lowercase(Locale.US)
        if (!lower.startsWith("http://") && !lower.startsWith("https://")) return false
        if (!lower.contains("xhscdn.com") && !lower.contains("xiaohongshu.com")) return false
        return lower.contains("sns-video") ||
            lower.contains("/video/") ||
            lower.contains(".mp4") ||
            lower.contains(".m3u8") ||
            lower.contains("originvideokey")
    }

