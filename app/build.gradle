    private fun downloadBestXhsVideo(showToast: Boolean = true) {
        val candidates = rankedXhsVideoUrls()
        if (candidates.isEmpty()) {
            if (showToast) Toast.makeText(this, "没有可用的视频源", Toast.LENGTH_SHORT).show()
            return
        }

        val userAgent = webView.settings.userAgentString.orEmpty()
        val referer = currentPageUrl
        val cookies = candidates.associateWith { candidate ->
            CookieManager.getInstance().getCookie(candidate).orEmpty()
        }

        if (showToast) {
            Toast.makeText(this, "正在验证并下载视频…", Toast.LENGTH_SHORT).show()
        }
        statusText.text = "正在验证视频源并下载…"

        XhsVideoDownloader(this).download(
            candidates = candidates,
            userAgent = userAgent,
            referer = referer,
            cookies = cookies
        ) { result ->
            runOnUiThread {
                statusText.text = result.message
                Toast.makeText(
                    this,
                    result.message,
                    if (result.success) Toast.LENGTH_SHORT else Toast.LENGTH_LONG
                ).show()
            }
        }
    }

