                const videoSeen = new Set();
                const addVideo = (u, source) => {
                  if (!u || typeof u !== 'string') return;
                  u = normalise(u);
                  if (u.startsWith('//')) u = 'https:' + u;
                  if (!/^https?:/i.test(u)) return;
                  if (!/(xhscdn\\.com|xiaohongshu\\.com)/i.test(u)) return;
                  if (!/(sns-video|\\.mp4(?:[?#]|$)|\\.m3u8(?:[?#]|$)|\\/video\\/)/i.test(u)) return;
                  if (videoSeen.has(u)) return;
                  videoSeen.add(u);
                  try { HDExtractor.addXhsVideo(u, String(source || '')); } catch(e) {}
                };

                document.querySelectorAll('video, video source, source[type^="video"]').forEach(el => {
                  addVideo(el.currentSrc, 'dom-video');
                  addVideo(el.src, 'dom-video');
                  addVideo(el.getAttribute && el.getAttribute('src'), 'dom-video');
                });

                try {
                  performance.getEntriesByType('resource').forEach(e => {
                    addVideo(String(e.name || ''), 'performance-video');
                  });
                } catch(e) {}

                const inspectText = (t) => {
                  if (!t || typeof t !== 'string') return;
                  let m;
                  const keyRe = /["']originVideoKey["']\\s*:\\s*["']([^"']+)["']/gi;
                  while ((m = keyRe.exec(t)) !== null) {
                    addVideo('https://sns-video-bd.xhscdn.com/' + m[1], 'originVideoKey');
                  }
                  const masterRe = /["']masterUrl["']\\s*:\\s*["']([^"']+)["']/gi;
                  while ((m = masterRe.exec(t)) !== null) {
                    addVideo(m[1], 'masterUrl');
                  }
                  const urlRe = /https?:\\?\\/\\?\\/[^"'<>\\s]+/gi;
                  let guard = 0;
                  while ((m = urlRe.exec(t)) !== null && guard < 800) {
                    addVideo(m[0], 'script-video');
                    guard++;
                  }
                };

                document.querySelectorAll('script').forEach(s => inspectText(s.textContent || ''));
                try {
                  inspectText(document.documentElement ? document.documentElement.innerHTML : '');
                } catch(e) {}
              } catch(e) {}

