plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('HDRESOURCEEXTRACTOR_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('HDRESOURCEEXTRACTOR_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('HDRESOURCEEXTRACTOR_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HDRESOURCEEXTRACTOR_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace 'com.combustible12.hdresourceextractor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.combustible12.hdresourceextractor'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '0.15.6'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'io.coil-kt:coil:2.7.0'
}



